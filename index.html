    <script>
      (function () {
        try {
          var props = ['fetch', 'Request', 'Response', 'Headers'];
          props.forEach(function (prop) {
            try {
              var current = window[prop];
              Object.defineProperty(window, prop, {
                get: function () {
                  return current;
                },
                set: function (val) {
                  current = val;
                },
                configurable: true,
                enumerable: true,
              });
            } catch (e) {}
          });
        } catch (err) {}
      })();
    </script>
